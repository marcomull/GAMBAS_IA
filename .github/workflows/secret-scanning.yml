name: Secret scanning

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks/gitleaks-action@v2 exige una GITLEAKS_LICENSE paga para
        # cuentas de organizacion desde su ultimo breaking change. Corremos
        # el binario open-source directamente (via su imagen oficial de
        # Docker) para no depender de esa licencia.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1
