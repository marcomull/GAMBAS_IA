spring.application.name=finance-ai

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

servicio.ia.url=${SERVICIO_IA_URL:http://localhost:8000}

# Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hackathon_finance_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (crea automáticamente la estructura de tablas vacía desde 0)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (mínimo 256 bits / 32 caracteres) — sin default, ver nota arriba
api.security.token.secret=${JWT_SECRET}

